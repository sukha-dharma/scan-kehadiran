<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Absensi</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    /* Dua warna gradasi latar. Ganti sesuai warna logo. */
    --warna-1: #968146;
    --warna-2: #fff0ac;

    --ink: #1c2b2d; --line: #d5d9d2;
    --ok: #1f7a4d; --warn: #a86a0c; --bad: #b3372f; --idle: #5b6b6e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 20px 16px 32px; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--warna-1), var(--warna-2)) fixed;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #fff; text-align: center; }
  .logo { background: #fff; border-radius: 16px; padding: 8px; }
  .logo img { display: block; max-height: 72px; max-width: 200px; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0; }

  .kartu { background: #fff; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  label { font-size: .95rem; font-weight: 600; }
  input[type=password] {
    font: inherit; width: 100%; padding: 12px; margin-top: 6px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button {
    font: inherit; font-weight: 600; padding: 14px; border-radius: 10px; border: 0;
    background: var(--ink); color: #fff; width: 100%; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button.sekunder { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; padding: 10px; }
  button:focus-visible, input:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 2px; }
  #pesanPin { min-height: 1.3em; margin: 0; font-size: .95rem; color: var(--bad); }

  #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; min-height: 80px; }
  #hasil {
    border-radius: 10px; padding: 18px; background: #fff; border: 2px solid var(--line);
    min-height: 110px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  #hasil .besar { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
  #hasil .kecil { font-size: .95rem; color: var(--idle); }
  #hasil.ok   { border-color: var(--ok);   background: #e8f5ee; } #hasil.ok   .besar { color: var(--ok); }
  #hasil.sudah{ border-color: var(--warn); background: #fdf3e1; } #hasil.sudah .besar { color: var(--warn); }
  #hasil.gagal{ border-color: var(--bad);  background: #fbeae8; } #hasil.gagal .besar { color: var(--bad); }
  #riwayat { list-style: none; margin: 0; padding: 0; font-size: .95rem; }
  #riwayat li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  #riwayat .tag-ok { color: var(--ok); } #riwayat .tag-sudah { color: var(--warn); } #riwayat .tag-gagal { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <!-- Unggah logo ke repository dengan nama logo.png. Jika file tidak ada, logo disembunyikan. -->
    <div class="logo"><img id="logo" src="logo.png" alt="Logo" onerror="this.parentElement.hidden = true"></div>
    <h1>Scan Absensi</h1>
  </header>

  <!-- Layar 1: PIN (selalu tampil lebih dulu) -->
  <section id="layarPin" class="kartu">
    <form id="formPin" class="kartu" style="padding:0">
      <div>
        <label for="inputPin">Masukkan PIN absensi</label>
        <input id="inputPin" type="password" autocomplete="off" required>
      </div>
      <p id="pesanPin" aria-live="polite"></p>
      <button type="submit" id="btnMasuk">Masuk</button>
    </form>
  </section>

  <!-- Layar 2: Scanner (muncul setelah PIN benar) -->
  <section id="layarScan" hidden style="display:flex; flex-direction:column; gap:14px">
    <div id="reader"></div>
    <button id="btnMulai">Mulai scan</button>

    <div id="hasil" aria-live="polite">
      <div class="besar">Siap</div>
      <div class="kecil">Tekan "Mulai scan", lalu arahkan kamera ke QR di kartu.</div>
    </div>

    <div class="kartu">
      <h2>Scan sesi ini</h2>
      <ul id="riwayat"></ul>
    </div>

    <button class="sekunder" id="btnKeluar" style="background:#fff">Keluar (kunci kembali)</button>
  </section>
</main>

<script>
  // ====== PENGATURAN ======
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQG_A-Y8DtQVjaGqb6rTfCKRP8oLPcyy7lQC0CNmUcoByxqTF00AXXa2n3PBGcjt8h/exec';
  // ========================

  const $ = (id) => document.getElementById(id);
  const layarPin = $('layarPin'), layarScan = $('layarScan');
  const formPin = $('formPin'), inputPin = $('inputPin'), btnMasuk = $('btnMasuk');
  const hasil = $('hasil'), riwayat = $('riwayat'), btnMulai = $('btnMulai');

  let pin = '';               // PIN hanya disimpan di memori halaman ini, hilang saat halaman ditutup/dimuat ulang
  let scanner = null, kameraAktif = false;
  let sibuk = false, kodeTerakhir = '', waktuTerakhir = 0;

  // Hapus PIN yang mungkin tersimpan oleh versi lama halaman ini
  try { localStorage.removeItem('pin_absensi'); } catch (e) {}

  function kirim(isi) {
    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain agar tidak kena preflight CORS
      body: JSON.stringify(isi)
    }).then((res) => res.json());
  }

  function pesanPin(teks) { $('pesanPin').textContent = teks || ''; }

  function tampil(kelas, besar, kecil) {
    hasil.className = kelas;
    hasil.innerHTML = '<div class="besar"></div><div class="kecil"></div>';
    hasil.children[0].textContent = besar;
    hasil.children[1].textContent = kecil || '';
  }

  function bunyi(nada) {
    try { navigator.vibrate && navigator.vibrate(nada === 'ok' ? 120 : [100, 60, 100]); } catch (e) {}
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.frequency.value = nada === 'ok' ? 880 : 300; g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  function tambahRiwayat(kelas, teks, status) {
    const li = document.createElement('li');
    const kiri = document.createElement('span'); kiri.textContent = teks;
    const kanan = document.createElement('span'); kanan.className = 'tag-' + kelas; kanan.textContent = status;
    li.append(kiri, kanan);
    riwayat.prepend(li);
  }

  // Jika ada error tak terduga, tampilkan di layar (bukan diam saja)
  window.addEventListener('error', (e) => {
    if (!layarScan.hidden) tampil('gagal', 'Ada error di halaman', e.message);
    else pesanPin('Ada error di halaman: ' + e.message);
  });

  // ---- Layar PIN ----
  formPin.addEventListener('submit', async (e) => {
    e.preventDefault();
    const coba = inputPin.value.trim();
    if (!coba) { pesanPin('PIN belum diisi.'); return; }
    btnMasuk.disabled = true; pesanPin('Memeriksa...');
    try {
      const d = await kirim({ aksi: 'cek_pin', pin: coba });
      if (d.status === 'pin_ok') {
        pin = coba; inputPin.value = ''; pesanPin('');
        layarPin.hidden = true; layarScan.hidden = false;
        tampil('', 'Siap', 'Tekan "Mulai scan", lalu arahkan kamera ke QR di kartu.');
      } else if (d.status === 'salah_pin') {
        pesanPin('PIN salah. Coba lagi.'); inputPin.select();
      } else {
        pesanPin('Script Google belum diperbarui. Deploy versi baru dulu, lalu muat ulang halaman ini.');
      }
    } catch (err) {
      pesanPin('Gagal terhubung. Cek internet atau URL web app, lalu coba lagi.');
    }
    btnMasuk.disabled = false;
  });

  async function kunciLagi(pesan) {
    if (kameraAktif && scanner) { try { await scanner.stop(); } catch (e) {} kameraAktif = false; }
    pin = ''; riwayat.innerHTML = ''; btnMulai.hidden = false;
    layarScan.hidden = true; layarPin.hidden = false;
    pesanPin(pesan || ''); inputPin.focus();
  }
  $('btnKeluar').addEventListener('click', () => kunciLagi(''));

  // ---- Layar Scanner ----
  async function onScan(teks) {
    const kode = teks.trim().toUpperCase();
    const sekarang = Date.now();
    // abaikan kartu yang sama jika masih di depan kamera
    if (sibuk || (kode === kodeTerakhir && sekarang - waktuTerakhir < 6000)) return;
    sibuk = true; kodeTerakhir = kode; waktuTerakhir = sekarang;
    tampil('', 'Memproses...', kode);

    try {
      const d = await kirim({ kode: kode, pin: pin });

      if (d.status === 'ok') {
        tampil('ok', 'Hadir: ' + d.nama, kode + ' | total hadir: ' + d.jumlah);
        tambahRiwayat('ok', d.nama + ' (' + kode + ')', 'dicatat'); bunyi('ok');
      } else if (d.status === 'sudah') {
        tampil('sudah', 'Sudah absen hari ini', d.nama + ' (' + kode + ')');
        tambahRiwayat('sudah', d.nama + ' (' + kode + ')', 'sudah absen'); bunyi('gagal');
      } else if (d.status === 'tidak_ditemukan') {
        tampil('gagal', 'Kode tidak terdaftar', kode);
        tambahRiwayat('gagal', kode, 'tidak terdaftar'); bunyi('gagal');
      } else if (d.status === 'salah_pin') {
        kodeTerakhir = '';
        await kunciLagi('PIN tidak berlaku lagi. Masukkan PIN yang baru.'); bunyi('gagal');
      } else {
        tampil('gagal', 'Terjadi kesalahan', d.pesan || ''); bunyi('gagal');
      }
    } catch (err) {
      tampil('gagal', 'Gagal terhubung', 'Cek internet atau URL web app, lalu scan ulang.');
      kodeTerakhir = ''; bunyi('gagal');
    }
    setTimeout(() => { sibuk = false; }, 1500);
  }

  btnMulai.addEventListener('click', async () => {
    if (typeof Html5Qrcode === 'undefined') {
      tampil('gagal', 'Pustaka scanner gagal dimuat', 'Cek internet, matikan pemblokir iklan, lalu muat ulang halaman.'); return;
    }
    if (!scanner) scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } }, onScan, () => {});
      kameraAktif = true; btnMulai.hidden = true;
      tampil('', 'Kamera aktif', 'Arahkan ke QR di kartu karyawan.');
    } catch (err) {
      tampil('gagal', 'Kamera tidak bisa dibuka', 'Izinkan akses kamera untuk situs ini di pengaturan Chrome.');
    }
  });
</script>
</body>
</html>
